<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Test Lab</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1a1e25;
    --panel-2:#20252d;
    --line:#2a303a;
    --ink:#edeef0;
    --ink-dim:#8b92a0;
    --accent:#4fd1c5;
    --accent-dim:#2f7a72;
    --warn:#e8a33d;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px;}
  .scope{width:100%;max-width:120px;height:28px;margin:0 auto 18px;opacity:.85;}
  .card{
    width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;
  }
  h1{font-size:22px;line-height:1.4;margin:0 0 14px;font-weight:600;}
  p{line-height:1.75;color:var(--ink-dim);font-size:14.5px;margin:0 0 14px;}
  .rule{height:1px;background:var(--line);margin:22px 0;}
  ul.checklist{list-style:none;padding:0;margin:0 0 18px;}
  ul.checklist li{
    display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);
    padding:8px 0;border-bottom:1px dashed var(--line);
  }
  ul.checklist li:last-child{border-bottom:none;}
  ul.checklist .tick{color:var(--accent);font-family:var(--mono);flex:none;}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px;}
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:11px 12px;color:var(--ink);font-size:14px;font-family:var(--mono);
  }
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  .consent{
    display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:16px;margin:18px 0;
  }
  .consent input[type=checkbox]{
    width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent);cursor:pointer;
  }
  .consent p{margin:0;color:var(--ink);font-size:13.5px;line-height:1.65;}
  .btn{
    appearance:none;border:none;border-radius:6px;padding:13px 22px;font-size:14px;font-weight:600;
    font-family:var(--sans);cursor:pointer;transition:transform .12s ease, background .12s ease;
  }
  .btn-primary{background:var(--accent);color:#0a1210;}
  .btn-primary:hover{background:#6fe0d5;}
  .btn-primary:disabled{background:#33393f;color:#6b7078;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink-dim);}
  .btn-file{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;
    padding:13px 18px;font-family:var(--mono);font-size:13px;cursor:pointer;flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-file:hover{border-color:var(--accent-dim);}
  .btn-file.played{border-color:var(--accent);color:var(--accent);}
  .row{display:flex;gap:12px;margin-top:22px;}
  .row.end{justify-content:flex-end;}
  .row.between{justify-content:space-between;align-items:center;}

  .progress-wrap{width:100%;max-width:640px;margin-bottom:14px;}
  .progress-track{height:3px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .35s ease;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:8px;display:flex;justify-content:space-between;}

  .stage{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:34px 10px 26px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);
    margin-bottom:26px;
  }
  .pair-row{display:flex;gap:14px;width:100%;max-width:360px;}
  .play-btn{
    width:76px;height:76px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;
    color:var(--accent);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .play-btn:hover{background:rgba(79,209,197,.1);}
  .play-btn:active{transform:scale(.96);}
  .scope-line{width:180px;height:36px;margin-top:18px;}
  .scope-line path{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.55;}
  .play-count{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:12px;letter-spacing:.05em;text-align:center;}

  .scale-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px;}
  .scale{display:grid;gap:8px;}
  .scale.acr{grid-template-columns:repeat(5,1fr);}
  .scale.ccr{grid-template-columns:repeat(7,1fr);}
  .opt{
    border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:14px 4px 10px;
    text-align:center;cursor:pointer;transition:border-color .12s ease, background .12s ease;
  }
  .opt .num{font-family:var(--mono);font-size:16px;color:var(--ink);}
  .opt .lbl{font-size:10px;color:var(--ink-dim);margin-top:6px;line-height:1.3;}
  .opt:hover{border-color:var(--accent-dim);}
  .opt.selected{border-color:var(--accent);background:rgba(79,209,197,.08);}
  .opt.selected .num{color:var(--accent);}

  .attn-flag{
    font-family:var(--mono);font-size:11px;color:var(--warn);border:1px solid var(--warn);
    border-radius:6px;padding:8px 12px;margin-bottom:18px;background:rgba(232,163,61,.08);
  }
  .type-badge{
    display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--accent-dim);border-radius:10px;padding:2px 10px;margin-bottom:14px;
  }

  .footer-note{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);text-align:center;margin-top:18px;max-width:640px;line-height:1.7;}

  .admin-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin-top:16px;}
  .admin-table th,.admin-table td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;}
  .admin-table th{color:var(--ink-dim);font-weight:500;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .bar-track{background:var(--panel-2);border-radius:3px;height:6px;width:100%;overflow:hidden;margin-top:5px;}
  .bar-fill{background:var(--accent);height:100%;}
  .bar-fill.neg{background:var(--warn);}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink-dim);}
  .pill.bad{color:var(--warn);border-color:var(--warn);}
  h2.section{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:26px 0 4px;}
</style>
</head>
<body>

<svg class="scope" viewBox="0 0 120 28" xmlns="http://www.w3.org/2000/svg">
  <polyline points="0,14 15,14 20,4 26,24 32,14 46,14 51,8 56,20 61,14 120,14"
    fill="none" stroke="#4fd1c5" stroke-width="1.6" opacity="0.8"/>
</svg>

<div id="app"></div>

<script>
/* =========================================================================
   CONFIG - edit this section to run your own study
   =========================================================================
   Trials are generated automatically from a folder manifest, so you don't
   hand-write one entry per file. Expected layout on your file host (any
   static host / object storage with public HTTPS URLs works):

     AUDIO_BASE/
       ground_truth/  utt01.wav  utt02.wav  ...  uttNN.wav
       method_a/      utt01.wav  utt02.wav  ...  uttNN.wav
       method_b/      utt01.wav  utt02.wav  ...  uttNN.wav
       method_c/      utt01.wav  utt02.wav  ...  uttNN.wav

   Every folder must contain the SAME filenames - i.e. utt01.wav under each
   method is the same underlying utterance/content, just processed
   differently. That matched-content design is what lets per-utterance
   pairing (paired t-test / repeated-measures analysis) work later.

   TEST_ID: give each separate study run a unique name so results don't mix.
   ========================================================================= */
const TEST_ID = "listest_2026_demo";

// Leave AUDIO_BASE pointing at any public HTTPS static host, OR - the
// simplest option for GitHub Pages - put the audio files inside this same
// repo under an /audio folder and use a relative path like "./audio".
// Same-origin audio avoids CORS entirely.
const AUDIO_BASE = "./audio";

// Only needed when this page is NOT running inside a Claude artifact (e.g.
// deployed on GitHub Pages). Paste the Google Apps Script Web App URL here
// (see the deployment guide) to enable saving/loading results. Leave blank
// while testing inside Claude - window.storage is used automatically instead.
const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyRGMK3LJuzGs5UxKxxjTvOKK4OH1lKLyyllBr7ONX6oqBlA02Y-xYwiYzbD_16H0NM/exec";


const METHODS = [
  { key:"ground_truth", label:"Ground-Truth", folder:"ground_truth", isReference:true },
  { key:"EV2A",     label:"ev2a",      folder:"EV2A" },
  { key:"VM",     label:"vm",      folder:"VM" },
  { key:"EBVM",     label:"ebvm",      folder:"EBVM" },
];

// 8-12 matched utterances is a good default for a 10-20 listener study
// (see the recommendation notes in the chat reply). List the shared
// filename stems here - each must exist in every method folder above.
const UTTERANCE_IDS = ["p234_005_mic1","p234_057_mic1","p234_109_mic1","p234_216_mic1","p262_016_mic1","p262_128_mic1","p262_304_mic1","p262_381_mic1","p376_079_mic1","p376_146_mic1","p376_291_mic1"];

// Toggle which blocks to include. Turning both on roughly doubles session
// length - see the estimated duration shown on the intro screen.
const INCLUDE_ACR_BLOCK = true;   // Block 1: absolute quality rating per condition
const INCLUDE_CCR_BLOCK = true;   // Block 2: each method vs Ground-Truth, paired
const USE_DEMO_AUDIO = false;      // set to false once your real audioUrl files are in place

const INSTRUCTIONS_INTRO = `
You will complete two short blocks. In Block 1 you will rate the overall
quality of single audio clips. In Block 2 you will compare pairs of clips
and judge how the second one sounds relative to the first. Please use
headphones in a quiet environment.
`;

const CONSENT_TEXT = `
I agree to voluntarily take part in this listening test. I understand that
my responses will be recorded anonymously under a participant ID and used
only for research and analysis purposes, and that I may stop at any time.
`;

function audioUrl(folder, uttId){
  return `${AUDIO_BASE}/${folder}/${uttId}.wav`;
}

function buildTrials(){
  const trials = [];

  if(INCLUDE_ACR_BLOCK){
    METHODS.forEach(m=>{
      UTTERANCE_IDS.forEach((u,i)=>{
        trials.push({
          id:`acr_${m.key}_${u}`, type:"acr", condition:m.label,
          audioUrl: USE_DEMO_AUDIO ? "" : audioUrl(m.folder,u),
          demo:{ noise: m.isReference ? 0 : 0.15 + 0.2*(METHODS.indexOf(m)%3), freq: 330+i*22 }
        });
      });
    });
    trials.push({ id:"acr_attn", type:"acr", condition:"__attention__", attention:true,
      attentionText:"Attention check: please select 'Excellent (5)' regardless of what you hear.",
      audioUrl:"", demo:{noise:0.3, freq:392} });
  }

  if(INCLUDE_CCR_BLOCK){
    const ref = METHODS.find(m=>m.isReference) || METHODS[0];
    METHODS.filter(m=>!m.isReference).forEach(m=>{
      UTTERANCE_IDS.forEach((u,i)=>{
        const demoBase = 330+i*22;
        trials.push({
          id:`ccr_${m.key}_${u}`, type:"ccr", refCondition:ref.label, testCondition:m.label,
          refAudioUrl: USE_DEMO_AUDIO ? "" : audioUrl(ref.folder,u),
          testAudioUrl: USE_DEMO_AUDIO ? "" : audioUrl(m.folder,u),
          demoRef:{noise:0, freq:demoBase},
          demoTest:{noise:0.15+0.2*(METHODS.indexOf(m)%3), freq:demoBase}
        });
      });
    });
    trials.push({ id:"ccr_attn", type:"ccr", refCondition:"__attention__", testCondition:"__attention__", attention:true,
      attentionText:"Attention check: please select 'About the same (0)' regardless of what you hear.",
      refAudioUrl:"", testAudioUrl:"", demoRef:{noise:0.2, freq:392}, demoTest:{noise:0.2, freq:392} });
  }

  return trials;
}

const TRIALS = buildTrials();
const EST_MINUTES = Math.max(1, Math.round(TRIALS.length * 20 / 60));

const ACR_LABELS = [
  {v:1,label:"Bad"}, {v:2,label:"Poor"}, {v:3,label:"Fair"}, {v:4,label:"Good"}, {v:5,label:"Excellent"}
];
const CCR_LABELS = [
  {v:-3,label:"Much worse"}, {v:-2,label:"Worse"}, {v:-1,label:"Slightly worse"},
  {v:0,label:"About the same"}, {v:1,label:"Slightly better"}, {v:2,label:"Better"}, {v:3,label:"Much better"}
];

/* ========================================================================= */

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const isAdmin = params.get("admin") === "1";

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randId(){ return "P" + Math.random().toString(36).slice(2,7).toUpperCase(); }

// ---- demo synth audio (placeholder until real audio files are provided) ----
let actx;
function ensureCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function playDemoTone({noise=0.3, freq=440}, onEnd){
  const ctx = ensureCtx();
  const dur = 1.4;
  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = freq;
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.0001, now);
  oscGain.gain.exponentialRampToValueAtTime(0.22, now+0.05);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.connect(oscGain).connect(ctx.destination);

  let noiseSrc = null, noiseGain = null;
  if(noise > 0){
    const bufSize = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
    noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = buf;
    noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.14*noise, now+0.05);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    noiseSrc.connect(noiseGain).connect(ctx.destination);
  }
  osc.start(now); osc.stop(now+dur);
  if(noiseSrc){ noiseSrc.start(now); noiseSrc.stop(now+dur); }
  osc.onended = () => onEnd && onEnd();
}
function playStimulus(audioUrl, demo, onEnd){
  if(audioUrl){
    const audio = new Audio(audioUrl);
    audio.onended = () => onEnd && onEnd();
    audio.play();
  } else {
    playDemoTone(demo || {}, onEnd);
  }
}

// ---- storage helpers (auto: Claude artifact storage, or GAS backend for self-hosted deployments) ----
function hasClaudeStorage(){
  return typeof window.storage !== "undefined" && window.storage && typeof window.storage.set === "function";
}
async function saveResponse(rec){
  if(hasClaudeStorage()){
    const key = `resp:${TEST_ID}:${rec.participantId}:${rec.trialId}`;
    try{ await window.storage.set(key, JSON.stringify(rec), true); }
    catch(e){ console.error("save failed", e); }
    return;
  }
  if(GAS_WEBAPP_URL){
    try{
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight against Apps Script
        body: JSON.stringify({ action:"save", testId: TEST_ID, record: rec })
      });
    }catch(e){ console.error("save failed", e); }
    return;
  }
  console.error("No storage backend configured. Set GAS_WEBAPP_URL for non-Claude deployments (e.g. GitHub Pages).");
}
async function loadAllResponses(){
  if(hasClaudeStorage()){
    const listRes = await window.storage.list(`resp:${TEST_ID}:`, true);
    const keys = (listRes && listRes.keys) || [];
    const out = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) out.push(JSON.parse(r.value));
      }catch(e){ /* skip missing */ }
    }
    return out;
  }
  if(GAS_WEBAPP_URL){
    try{
      const res = await fetch(`${GAS_WEBAPP_URL}?action=list&testId=${encodeURIComponent(TEST_ID)}`);
      const data = await res.json();
      return data.records || [];
    }catch(e){ console.error("load failed", e); return []; }
  }
  return [];
}

// ============================ PARTICIPANT FLOW ============================
let state = {
  screen: "intro",
  participantId: randId(),
  consentGiven: false,
  order: [],
  idx: 0,
  answers: {},
  attentionFail: false
};

function render(){
  if(isAdmin){ renderAdmin(); return; }
  if(state.screen === "intro") return renderIntro();
  if(state.screen === "trial") return renderTrial();
  if(state.screen === "done") return renderDone();
}

function renderIntro(){
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">Listening Test · ${TRIALS.length} trials · approx. ${EST_MINUTES} min</div>
    <h1>Speech quality listening test</h1>
    <p>${INSTRUCTIONS_INTRO.trim()}</p>
    <ul class="checklist">
      <li><span class="tick">✓</span> Wear headphones, in a quiet room</li>
      <li><span class="tick">✓</span> Each clip can be replayed as many times as you like</li>
      <li><span class="tick">✓</span> Block 1: rate overall quality, 1 = bad, 5 = excellent</li>
      <li><span class="tick">✓</span> Block 2: rate the second clip relative to the first, -3 to +3</li>
      <li><span class="tick">✓</span> Please don't switch to other tabs or apps during the test</li>
    </ul>
    <div class="rule"></div>
    <div class="consent">
      <input type="checkbox" id="consentBox">
      <p>${CONSENT_TEXT.trim()}</p>
    </div>
    <label>Participant ID (auto-generated, feel free to keep it)</label>
    <input type="text" id="pid" value="${state.participantId}">
    <div class="row end">
      <button class="btn btn-primary" id="startBtn" disabled>Start test →</button>
    </div>
  </div>
  <div class="footer-note">TEST_ID: ${TEST_ID} · responses are recorded anonymously for analysis</div>
  `;
  const consentBox = document.getElementById("consentBox");
  const startBtn = document.getElementById("startBtn");
  consentBox.onchange = () => { startBtn.disabled = !consentBox.checked; };
  startBtn.onclick = () => {
    const val = document.getElementById("pid").value.trim();
    state.participantId = val || state.participantId;
    state.order = shuffle(TRIALS);
    state.screen = "trial";
    state.idx = 0;
    render();
  };
}

function renderTrial(){
  const trial = state.order[state.idx];
  const total = state.order.length;
  const selected = state.answers[trial.id];
  const isCCR = trial.type === "ccr";
  const labels = isCCR ? CCR_LABELS : ACR_LABELS;

  // for CCR trials, randomize whether ref or test plays first (per participant+trial)
  if(isCCR && trial._firstIsRef === undefined){
    trial._firstIsRef = Math.random() < 0.5;
  }

  app.innerHTML = `
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${(state.idx/total*100).toFixed(1)}%"></div></div>
    <div class="progress-label"><span>ITEM ${state.idx+1} / ${total}</span><span>${state.participantId}</span></div>
  </div>
  <div class="card">
    <div class="type-badge">${isCCR ? "Block 2 · Comparison" : "Block 1 · Quality"}</div>
    ${trial.attention ? `<div class="attn-flag">⚠ ${trial.attentionText}</div>` : ""}
    <div class="stage">
      ${isCCR ? `
        <div class="pair-row">
          <button class="btn-file" id="playA">▶ Play A</button>
          <button class="btn-file" id="playB">▶ Play B</button>
        </div>
        <div class="play-count" id="playCount">Play both clips at least once before rating</div>
      ` : `
        <button class="play-btn" id="playBtn">▶</button>
        <svg class="scope-line" id="scopeLine" viewBox="0 0 180 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,18 L180,18" />
        </svg>
        <div class="play-count" id="playCount">Not played yet · tap the circle to play</div>
      `}
    </div>
    <div class="scale-title">${isCCR ? "How does clip B compare to clip A?" : "Overall quality"}</div>
    <div class="scale ${isCCR ? 'ccr' : 'acr'}" id="scale">
      ${labels.map(r => `
        <div class="opt ${selected===r.v?'selected':''}" data-val="${r.v}">
          <div class="num">${r.v > 0 ? '+'+r.v : r.v}</div><div class="lbl">${r.label}</div>
        </div>`).join("")}
    </div>
    <div class="row end">
      <button class="btn btn-primary" id="nextBtn" disabled>
        ${state.idx===total-1 ? "Submit and finish" : "Next →"}
      </button>
    </div>
  </div>
  <div class="footer-note">System / condition labels are hidden from participants during the test to preserve blind listening</div>
  `;

  let playedA = false, playedB = false, playedOnce = !!selected;

  function updateNextEnabled(){
    const btn = document.getElementById("nextBtn");
    if(isCCR){
      btn.disabled = !(playedA && playedB && state.answers[trial.id]!=null);
    } else {
      btn.disabled = !(playedOnce && state.answers[trial.id]!=null);
    }
  }

  if(isCCR){
    const firstUrl  = trial._firstIsRef ? trial.refAudioUrl  : trial.testAudioUrl;
    const firstDemo = trial._firstIsRef ? trial.demoRef      : trial.demoTest;
    const secondUrl  = trial._firstIsRef ? trial.testAudioUrl : trial.refAudioUrl;
    const secondDemo = trial._firstIsRef ? trial.demoTest     : trial.demoRef;

    const btnA = document.getElementById("playA");
    const btnB = document.getElementById("playB");
    const playCountEl = document.getElementById("playCount");

    btnA.onclick = () => {
      btnA.disabled = true;
      playStimulus(firstUrl, firstDemo, () => {
        btnA.disabled = false; btnA.classList.add("played"); playedA = true;
        playCountEl.textContent = "You can replay either clip as many times as you like";
        updateNextEnabled();
      });
    };
    btnB.onclick = () => {
      btnB.disabled = true;
      playStimulus(secondUrl, secondDemo, () => {
        btnB.disabled = false; btnB.classList.add("played"); playedB = true;
        playCountEl.textContent = "You can replay either clip as many times as you like";
        updateNextEnabled();
      });
    };
  } else {
    const playBtn = document.getElementById("playBtn");
    const scopeLine = document.getElementById("scopeLine").querySelector("path");
    const playCountEl = document.getElementById("playCount");
    let localPlays = 0;
    playBtn.onclick = () => {
      playBtn.disabled = true;
      animateScope(scopeLine, true);
      playStimulus(trial.audioUrl, trial.demo, () => {
        playBtn.disabled = false;
        animateScope(scopeLine, false);
        localPlays++;
        playedOnce = true;
        playCountEl.textContent = `Played ${localPlays} time(s) · you can replay it`;
        updateNextEnabled();
      });
    };
  }

  document.querySelectorAll(".opt").forEach(el=>{
    el.onclick = () => {
      document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
      el.classList.add("selected");
      state.answers[trial.id] = parseInt(el.dataset.val,10);
      updateNextEnabled();
    };
  });

  document.getElementById("nextBtn").onclick = async () => {
    const rawScore = state.answers[trial.id];

    if(trial.attention){
      const expected = isCCR ? 0 : 5;
      state.attentionFail = state.attentionFail || (rawScore !== expected);
    }

    if(isCCR){
      // rawScore = "second clip vs first clip". Normalize to "test vs reference".
      const adjustedScore = trial._firstIsRef ? rawScore : -rawScore;
      await saveResponse({
        testId: TEST_ID,
        participantId: state.participantId,
        trialId: trial.id,
        type: "ccr",
        refCondition: trial.refCondition,
        testCondition: trial.testCondition,
        rawScore, adjustedScore,
        firstIsRef: trial._firstIsRef,
        isAttentionCheck: !!trial.attention,
        order: state.idx,
        ts: Date.now()
      });
    } else {
      await saveResponse({
        testId: TEST_ID,
        participantId: state.participantId,
        trialId: trial.id,
        type: "acr",
        condition: trial.condition,
        score: rawScore,
        isAttentionCheck: !!trial.attention,
        order: state.idx,
        ts: Date.now()
      });
    }

    if(state.idx < total-1){
      state.idx++;
      render();
    } else {
      state.screen = "done";
      render();
    }
  };
}

function animateScope(pathEl, playing){
  if(playing){
    pathEl.setAttribute("d","M0,18 Q15,4 30,18 T60,18 T90,18 T120,18 T150,18 T180,18");
    pathEl.style.transition = "d .3s ease";
  } else {
    pathEl.setAttribute("d","M0,18 L180,18");
  }
}

function renderDone(){
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">Complete</div>
    <h1>Thank you for taking part</h1>
    <p>Your participant ID was <b style="color:var(--ink)">${state.participantId}</b>. You completed
       ${state.order.length} trials.
       ${state.attentionFail ? "Note: one attention check was not answered as instructed - your data may be flagged for review." : ""}</p>
  </div>
  `;
}

function exportCSV(all){
  const header = ["participantId","type","trialId","condition","refCondition","testCondition",
    "score","rawScore","adjustedScore","firstIsRef","isAttentionCheck","order","ts"];
  const lines = [header.join(",")];
  all.forEach(r=>{
    const row = header.map(h => r[h]===undefined ? "" : String(r[h]).replace(/,/g,";"));
    lines.push(row.join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${TEST_ID}_responses.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================ ADMIN DASHBOARD ============================
async function renderAdmin(){
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">Admin</div>
    <h1>Results dashboard · ${TEST_ID}</h1>
    <p>Reading all participant responses from shared storage… data here is live and synced automatically across every participant's browser, no manual collection needed.</p>
    <div id="adminBody"></div>
    <div class="row end">
      <button class="btn btn-ghost" id="exportBtn">⭳ Export CSV</button>
      <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
    </div>
  </div>`;
  document.getElementById("refreshBtn").onclick = renderAdmin;

  const all = await loadAllResponses();
  window._lastResponses = all;
  document.getElementById("exportBtn").onclick = () => exportCSV(window._lastResponses || []);
  const body = document.getElementById("adminBody");
  if(all.length === 0){
    body.innerHTML = `<p>No data yet. Share the link without <code>?admin=1</code> with participants, then come back and refresh.</p>`;
    return;
  }
  const byPid = {};
  all.forEach(r => (byPid[r.participantId] ||= []).push(r));
  const nParticipants = Object.keys(byPid).length;
  const failedAttn = Object.entries(byPid).filter(([pid,recs]) =>
    recs.some(r => r.isAttentionCheck && (r.type==='ccr' ? r.rawScore !== 0 : r.score !== 5))
  ).map(([pid])=>pid);

  function stats(arr){
    const n = arr.length;
    const mean = arr.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(n-1,1));
    const ci = 1.96*sd/Math.sqrt(n);
    return {n, mean, sd, ci};
  }

  // ACR aggregation
  const byCond = {};
  all.filter(r=>r.type==='acr' && !r.isAttentionCheck).forEach(r=>{
    (byCond[r.condition] ||= []).push(r.score);
  });
  const acrRows = Object.entries(byCond).map(([cond,arr])=>{
    const s = stats(arr);
    const pct = (s.mean/5*100).toFixed(0);
    return `<tr>
      <td>${cond}</td><td>${s.n}</td><td>${s.mean.toFixed(2)}</td>
      <td>±${s.ci.toFixed(2)}</td><td>${s.sd.toFixed(2)}</td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  }).join("");

  // CCR aggregation (by testCondition vs refCondition pair, using adjustedScore = CMOS)
  const byPair = {};
  all.filter(r=>r.type==='ccr' && !r.isAttentionCheck).forEach(r=>{
    const key = `${r.testCondition} vs ${r.refCondition}`;
    (byPair[key] ||= []).push(r.adjustedScore);
  });
  const ccrRows = Object.entries(byPair).map(([pair,arr])=>{
    const s = stats(arr);
    const pct = Math.min(Math.abs(s.mean)/3*50, 50);
    const isNeg = s.mean < 0;
    return `<tr>
      <td>${pair}</td><td>${s.n}</td><td>${s.mean>=0?'+':''}${s.mean.toFixed(2)}</td>
      <td>±${s.ci.toFixed(2)}</td><td>${s.sd.toFixed(2)}</td>
      <td><div class="bar-track"><div class="bar-fill ${isNeg?'neg':''}" style="width:${pct}%;margin-left:${isNeg?50-pct:50}%"></div></div></td>
    </tr>`;
  }).join("");

  body.innerHTML = `
    <div class="row" style="gap:20px;margin:6px 0 4px;">
      <span class="pill">Participants N = ${nParticipants}</span>
      <span class="pill ${failedAttn.length?'bad':''}">Failed attention check = ${failedAttn.length}</span>
      <span class="pill">Total responses = ${all.length}</span>
    </div>

    <h2 class="section">Block 1 · ACR (Mean Opinion Score)</h2>
    <table class="admin-table">
      <thead><tr><th>Condition</th><th>N</th><th>Mean MOS</th><th>95% CI</th><th>SD</th><th></th></tr></thead>
      <tbody>${acrRows || `<tr><td colspan="6">No ACR data yet.</td></tr>`}</tbody>
    </table>

    <h2 class="section">Block 2 · CCR (Comparison MOS, test vs reference)</h2>
    <table class="admin-table">
      <thead><tr><th>Comparison</th><th>N</th><th>Mean CMOS</th><th>95% CI</th><th>SD</th><th>-3 ← 0 → +3</th></tr></thead>
      <tbody>${ccrRows || `<tr><td colspan="6">No CCR data yet.</td></tr>`}</tbody>
    </table>

    ${failedAttn.length ? `<p style="margin-top:14px;">Participants who failed the attention check: ${failedAttn.join(", ")} (consider excluding or flagging for review before final analysis).</p>` : ""}
  `;
}

render();
</script>
