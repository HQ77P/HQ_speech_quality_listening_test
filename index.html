<title>Listening Test Lab</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1a1e25;
    --panel-2:#20252d;
    --line:#2a303a;
    --ink:#edeef0;
    --ink-dim:#8b92a0;
    --accent:#4fd1c5;
    --accent-dim:#2f7a72;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px;}
  .scope{width:100%;max-width:120px;height:28px;margin:0 auto 18px;opacity:.85;}
  .card{
    width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;
  }
  h1{font-size:22px;line-height:1.4;margin:0 0 14px;font-weight:600;}
  p{line-height:1.75;color:var(--ink-dim);font-size:14.5px;margin:0 0 14px;}
  .rule{height:1px;background:var(--line);margin:22px 0;}
  ul.checklist{list-style:none;padding:0;margin:0 0 18px;}
  ul.checklist li{
    display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);
    padding:8px 0;border-bottom:1px dashed var(--line);
  }
  ul.checklist li:last-child{border-bottom:none;}
  ul.checklist .tick{color:var(--accent);font-family:var(--mono);flex:none;}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px;}
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:11px 12px;color:var(--ink);font-size:14px;font-family:var(--mono);

  input[type=text]:focus{outline:none;border-color:var(--accent);}

  }
  .consent input[type=checkbox]{
    width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent);cursor:pointer;

  .consent p{margin:0;color:var(--ink);font-size:13.5px;line-height:1.65;}

<script>
/* =========================================================================
   CONFIG - edit this section to run your own study
   =========================================================================
   Trials are generated automatically from a folder manifest, so you don't
   hand-write one entry per file. Expected layout on your file host (any
   static host / object storage with public HTTPS URLs works):

     AUDIO_BASE/
       ground_truth/  utt01.wav  utt02.wav  ...  uttNN.wav
       method_a/      utt01.wav  utt02.wav  ...  uttNN.wav
       method_b/      utt01.wav  utt02.wav  ...  uttNN.wav
       method_c/      utt01.wav  utt02.wav  ...  uttNN.wav

   Every folder must contain the SAME filenames - i.e. utt01.wav under each
   method is the same underlying utterance/content, just processed
   differently. That matched-content design is what lets per-utterance
   pairing (paired t-test / repeated-measures analysis) work later.

   TEST_ID: give each separate study run a unique name so results don't mix.
   ========================================================================= */
const TEST_ID = "listest_2026_demo_0903";

// simplest option for GitHub Pages - put the audio files inside this same
// repo under an /audio folder and use a relative path like "./audio".
// Same-origin audio avoids CORS entirely.

// deployed on GitHub Pages). Paste the Google Apps Script Web App URL here
// (see the deployment guide) to enable saving/loading results. Leave blank
// while testing inside Claude - window.storage is used automatically instead.
//
// NOTE: script.google.com / Google Sheets are blocked in mainland China.
// If any participants are there, use SUPABASE_URL/SUPABASE_KEY below
// instead - Supabase is generally reachable from mainland China without a

const SUPABASE_URL = "https://mebpxyzdxyqvqripmfpm.supabase.co/rest/v1/";  // e.g. "https://xxxxxxxx.supabase.co" (Project Settings > API)
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYnB4eXpkeHlxdnFyaXBtZnBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjQxMzMsImV4cCI6MjEwNDAwMDEzM30.Sp0NyG_ZpMPOJSJ4jrttnpDOEIWzkoj_RIJSsgGyJEk";  // the "anon public" key (Project Settings > API)


const METHODS = [

  { key:"EV2A",     label:"ev2a",      folder:"EV2A" },

// 8-12 matched utterances is a good default for a 10-20 listener study
// (see the recommendation notes in the chat reply). List the shared
// filename stems here - each must exist in every method folder above.
const UTTERANCE_IDS = ["p234_005_mic1","p234_057_mic1","p234_109_mic1","p234_216_mic1","p262_016_mic1","p262_128_mic1","p262_304_mic1","p262_381_mic1","p376_079_mic1","p376_146_mic1","p376_291_mic1"];

// Toggle which blocks to include. Turning both on roughly doubles session
// length - see the estimated duration shown on the intro screen.
const INCLUDE_ACR_BLOCK = true;   // Test 1: absolute quality rating per condition (ground-truth excluded)
const INCLUDE_CCR_BLOCK = true;   // Test 2: each method vs Ground-Truth, paired
const USE_DEMO_AUDIO = false;      // set to false once your real audioUrl files are in place

const INSTRUCTIONS_INTRO = `
You will complete two short, separate tests. Test 1 asks you to rate the
overall quality of single audio clips. Test 2 asks you to compare pairs of
clips. Test 1 must be finished in full before Test 2 begins.
and judge how the second one sounds relative to the first. Please use
headphones in a quiet environment.
`;

const CONSENT_TEXT = `
I agree to voluntarily take part in this listening test. I understand that
my responses will be recorded anonymously under a participant ID and used
only for research and analysis purposes, and that I may stop at any time.
`;

function audioUrl(folder, uttId){
  return `${AUDIO_BASE}/${folder}/${uttId}.wav`;
}

function buildTrials(){
  const trials = [];

  if(INCLUDE_ACR_BLOCK){
    // Ground-truth/reference is intentionally excluded from ACR - common
    // practice when the reference isn't itself a "system under test" (see
    // e.g. Fu et al. 2020, DNS Challenge MOS tables), and it avoids an
    // easy-to-spot ceiling-score item cueing listeners that a hidden
    // reference is present.
    METHODS.filter(m=>!m.isReference).forEach(m=>{
      UTTERANCE_IDS.forEach((u,i)=>{
        trials.push({
          id:`acr_${m.key}_${u}`, type:"acr", condition:m.label, testNumber:1,
          audioUrl: USE_DEMO_AUDIO ? "" : audioUrl(m.folder,u),
          demo:{ noise: 0.15 + 0.2*(METHODS.indexOf(m)%3), freq: 330+i*22 }
        });
      });
    });
    trials.push({ id:"acr_attn", type:"acr", condition:"__attention__", attention:true, testNumber:1,
      attentionText:"Attention check: please select 'Excellent (5)' regardless of what you hear.",
      audioUrl:"", demo:{noise:0.3, freq:392} });
  }

  if(INCLUDE_CCR_BLOCK){
    const ref = METHODS.find(m=>m.isReference) || METHODS[0];
    METHODS.filter(m=>!m.isReference).forEach(m=>{
      UTTERANCE_IDS.forEach((u,i)=>{
        const demoBase = 330+i*22;
        trials.push({
          id:`ccr_${m.key}_${u}`, type:"ccr", refCondition:ref.label, testCondition:m.label, testNumber:2,
          refAudioUrl: USE_DEMO_AUDIO ? "" : audioUrl(ref.folder,u),
          testAudioUrl: USE_DEMO_AUDIO ? "" : audioUrl(m.folder,u),

        });
      });

    trials.push({ id:"ccr_attn", type:"ccr", refCondition:"__attention__", testCondition:"__attention__", attention:true, testNumber:2,
      attentionText:"Attention check: please select 'About the same (0)' regardless of what you hear.",
      refAudioUrl:"", testAudioUrl:"", demoRef:{noise:0.2, freq:392}, demoTest:{noise:0.2, freq:392} });
  }

  return trials;
}

// Build the two tests SEPARATELY - each is shuffled within itself so items
// from Test 1 and Test 2 never interleave. Test 1 (ACR) always runs to
// completion before Test 2 (CCR) begins.
const ALL_TRIALS = buildTrials();
const TEST1_TRIALS = ALL_TRIALS.filter(t => t.testNumber === 1);
const TEST2_TRIALS = ALL_TRIALS.filter(t => t.testNumber === 2);
const TRIALS = ALL_TRIALS; // kept for the EST_MINUTES calculation below
const EST_MINUTES = Math.max(1, Math.round(TRIALS.length * 20 / 60));

const ACR_LABELS = [
  {v:1,label:"Bad"}, {v:2,label:"Poor"}, {v:3,label:"Fair"}, {v:4,label:"Good"}, {v:5,label:"Excellent"}
];
const CCR_LABELS = [
  {v:-3,label:"Much worse"}, {v:-2,label:"Worse"}, {v:-1,label:"Slightly worse"},
  {v:0,label:"About the same"}, {v:1,label:"Slightly better"}, {v:2,label:"Better"}, {v:3,label:"Much better"}
];

// Practice items shown right before each real test - always use a
// synthesized demo tone (regardless of USE_DEMO_AUDIO) so they work even
// before real audio is wired up, and answers are never saved anywhere.
const PRACTICE_TEST1 = { id:"practice_acr", type:"acr", condition:"__practice__",
  audioUrl:"", demo:{noise:0.25, freq:466} };
const PRACTICE_TEST2 = { id:"practice_ccr", type:"ccr", refCondition:"__practice__", testCondition:"__practice__",
  refAudioUrl:"", testAudioUrl:"", demoRef:{noise:0.05, freq:466}, demoTest:{noise:0.3, freq:466} };

/* ========================================================================= */

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const isAdmin = params.get("admin") === "1";

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randId(){ return "P" + Math.random().toString(36).slice(2,7).toUpperCase(); }

// The "method" a trial belongs to, for the no-consecutive-repeats shuffle
// below. For CCR trials the varying part is testCondition (refCondition is
// always the same Ground-Truth for every item).
function conditionKey(t){
  return t.type === "ccr" ? t.testCondition : t.condition;
}

// Random order, but avoids placing two trials from the same condition/method
// back-to-back. Shuffles fully at random, then repairs any adjacent repeats
// by swapping with a later item; retries a few times and keeps the best
// attempt, since a single repair pass can occasionally leave one repeat in
// place (e.g. right at the end of the array).
function shuffleNoAdjacentRepeats(items, keyFn, maxAttempts=25){
  let best = null, bestViolations = Infinity;

  for(let attempt = 0; attempt < maxAttempts; attempt++){
    const arr = shuffle(items);
    for(let i = 1; i < arr.length; i++){
      if(keyFn(arr[i]) !== keyFn(arr[i-1])) continue;
      let swapIdx = -1;
      for(let j = i+1; j < arr.length; j++){
        if(keyFn(arr[j]) === keyFn(arr[i-1])) continue; // would still repeat with arr[i-1]
        // avoid creating a NEW repeat between arr[i-1]'s old neighbor at j-1/j+1
        const wouldClashAfter = j < arr.length-1 && keyFn(arr[j+1]) === keyFn(arr[i]);
        if(!wouldClashAfter){ swapIdx = j; break; }
      }
      if(swapIdx !== -1){
        [arr[i], arr[swapIdx]] = [arr[swapIdx], arr[i]];
      }
    }
    let violations = 0;
    for(let i = 1; i < arr.length; i++){
      if(keyFn(arr[i]) === keyFn(arr[i-1])) violations++;
    }
    if(violations < bestViolations){ bestViolations = violations; best = arr; }
    if(violations === 0) break;
  }

  if(bestViolations > 0){
    console.warn(`shuffleNoAdjacentRepeats: could not fully eliminate consecutive same-condition items (${bestViolations} remaining) - one condition group may be too large relative to the total.`);
  }
  return best;
}

// ---- demo synth audio (placeholder until real audio files are provided) ----
let actx;
function ensureCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function playDemoTone({noise=0.3, freq=440}, onEnd){
  const ctx = ensureCtx();
  const dur = 1.4;
  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = freq;
  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.0001, now);
  oscGain.gain.exponentialRampToValueAtTime(0.22, now+0.05);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.connect(oscGain).connect(ctx.destination);

  let noiseSrc = null, noiseGain = null;
  if(noise > 0){
    const bufSize = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
    noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = buf;
    noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.14*noise, now+0.05);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    noiseSrc.connect(noiseGain).connect(ctx.destination);
  }
  osc.start(now); osc.stop(now+dur);
  if(noiseSrc){ noiseSrc.start(now); noiseSrc.stop(now+dur); }
  osc.onended = () => onEnd && onEnd();
}
// cache decoded buffers so replaying the same clip doesn't re-fetch/re-decode
const audioBufferCache = new Map();

async function decodeAudioFile(url){
  if(audioBufferCache.has(url)) return audioBufferCache.get(url);
  const ctx = ensureCtx();
  const resp = await fetch(url);
  if(!resp.ok) throw new Error(`HTTP ${resp.status} fetching ${url}`);
  const arrayBuf = await resp.arrayBuffer();
  // decodeAudioData parses raw PCM directly - unlike the <audio> element's
  // media pipeline, it has no lower bound on sample rate, so very low
  // sample rate files (e.g. 2000 Hz, used as an experimental condition)
  // decode and play correctly instead of being rejected as "unsupported".
  const audioBuf = await ctx.decodeAudioData(arrayBuf);
  audioBufferCache.set(url, audioBuf);
  return audioBuf;
}

async function playRealAudio(url, onEnd){
  try{
    const ctx = ensureCtx();
    if(ctx.state === "suspended") await ctx.resume(); // autoplay policies need a resume after a user gesture
    const buf = await decodeAudioFile(url);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.onended = () => onEnd && onEnd();
    src.start();
  }catch(err){
    console.error("Audio failed to load/decode:", url, err);
    alert(`Could not play this audio file:\n${url}\n\n${err.message}\n\nCheck the browser console (F12) for details, or verify the file loads directly at that URL.\nNote: if this file is hosted on a different origin than this page, it also needs CORS enabled for fetch() to read it.`);
    onEnd && onEnd(); // release the UI (don't leave Play permanently disabled)
  }
}

function playStimulus(audioUrl, demo, onEnd){
  if(!audioUrl){ playDemoTone(demo || {}, onEnd); return; }

  // Primary path: native <audio> element. It matches exactly what you get
  // when opening the file URL directly in a browser tab (same decoder,
  // same duration handling), which is the most reliable/predictable path
  // for files that are already in a standard sample rate.
  const audio = new Audio(audioUrl);
  let usedFallback = false;

  const fallbackToWebAudio = (reason) => {
    if(usedFallback) return;
    usedFallback = true;
    console.warn(`Native <audio> playback failed for ${audioUrl} (${reason}). Falling back to Web Audio decode (handles e.g. very low sample rate files).`);
    playRealAudio(audioUrl, onEnd);
  };

  audio.onended = () => { if(!usedFallback) onEnd && onEnd(); };
  audio.onerror = () => fallbackToWebAudio("onerror");
  audio.play().catch(err => fallbackToWebAudio(err.message || String(err)));
}

// ---- storage helpers ----
// Priority: Claude artifact storage > Supabase > Google Apps Script.
// Supabase is recommended when any participants are in mainland China,
// since script.google.com / Google Sheets are blocked there but Supabase
// is generally reachable without a VPN.
function hasClaudeStorage(){
  return typeof window.storage !== "undefined" && window.storage && typeof window.storage.set === "function";
}
function hasSupabase(){

// rec.order is renamed to trialOrder for Supabase since "order" is a
// reserved SQL keyword in Postgres.
function toSupabaseRow(rec){
  return {
    testId: rec.testId, participantId: rec.participantId, type: rec.type, trialId: rec.trialId,
    condition: rec.condition ?? null, refCondition: rec.refCondition ?? null, testCondition: rec.testCondition ?? null,
    score: rec.score ?? null, rawScore: rec.rawScore ?? null, adjustedScore: rec.adjustedScore ?? null,
    firstIsRef: rec.firstIsRef ?? null, isAttentionCheck: !!rec.isAttentionCheck,
    trialOrder: rec.order ?? null, ts: rec.ts
  };
}
function fromSupabaseRow(r){
  return {
    testId: r.testId, participantId: r.participantId, type: r.type, trialId: r.trialId,
    condition: r.condition, refCondition: r.refCondition, testCondition: r.testCondition,
    score: r.score, rawScore: r.rawScore, adjustedScore: r.adjustedScore,
    firstIsRef: r.firstIsRef, isAttentionCheck: r.isAttentionCheck, order: r.trialOrder, ts: r.ts
  };
}
function supabaseHeaders(){
  return { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` };
}

async function saveResponse(rec){
  if(hasClaudeStorage()){
    const key = `resp:${TEST_ID}:${rec.participantId}:${rec.trialId}`;
    try{
      const result = await window.storage.set(key, JSON.stringify(rec), true);
      return !!result;
    }catch(e){ console.error("save failed", e); return false; }
  }
  if(hasSupabase()){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/responses`, {
        method: "POST",
        headers: { ...supabaseHeaders(), "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify(toSupabaseRow(rec))
      });
      return res.ok;
    }catch(e){ console.error("save failed (supabase)", e); return false; }
  }
  if(GAS_WEBAPP_URL){
    try{
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight against Apps Script
        body: JSON.stringify({ action:"save", testId: TEST_ID, record: rec })
      });
      return res.ok;
    }catch(e){ console.error("save failed (gas)", e); return false; }
  }
  console.error("No storage backend configured. Set SUPABASE_URL/SUPABASE_KEY (recommended for mainland China) or GAS_WEBAPP_URL for non-Claude deployments.");
  return false;
}

async function loadAllResponses(){
  if(hasClaudeStorage()){
    const listRes = await window.storage.list(`resp:${TEST_ID}:`, true);
    const keys = (listRes && listRes.keys) || [];
    const out = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) out.push(JSON.parse(r.value));
      }catch(e){ /* skip missing */ }
    }
    return out;
  }
  if(hasSupabase()){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/responses?testId=eq.${encodeURIComponent(TEST_ID)}&select=*`, {
        headers: supabaseHeaders()
      });
      if(!res.ok) return [];
      const rows = await res.json();
      return rows.map(fromSupabaseRow);
    }catch(e){ console.error("load failed (supabase)", e); return []; }
  }
  if(GAS_WEBAPP_URL){
    try{
      const res = await fetch(`${GAS_WEBAPP_URL}?action=list&testId=${encodeURIComponent(TEST_ID)}`);
      const data = await res.json();
      return data.records || [];
    }catch(e){ console.error("load failed (gas)", e); return []; }
  }
  return [];
}

// Permanently deletes all stored responses for the current TEST_ID only -
// other TEST_ID's data (past rounds) is left untouched either way.
async function clearAllResponses(){
  if(hasClaudeStorage()){
    const listRes = await window.storage.list(`resp:${TEST_ID}:`, true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      try{ await window.storage.delete(k, true); }
      catch(e){ console.error("delete failed for", k, e); }
    }
    return;
  }
  if(hasSupabase()){
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/responses?testId=eq.${encodeURIComponent(TEST_ID)}`, {
        method: "DELETE",
        headers: supabaseHeaders()
      });
    }catch(e){ console.error("clear failed (supabase)", e); }
    return;
  }
  if(GAS_WEBAPP_URL){
    try{
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"clear", testId: TEST_ID })
      });
    }catch(e){ console.error("clear failed (gas)", e); }
  }
}

let state = {
  screen: "intro",
  participantId: randId(),
  consentGiven: false,
  order: [],       // current phase's trial order (Test 1 or Test 2, never both)
  phase: null,     // "test1" | "test2"
  idx: 0,
  answers: {},
  attentionFail: false,
  practiceAnswers: {},
  submitting: false // guards against double-clicking Next before a save finishes
};

// Bumped on every screen transition. Async callbacks captured by a given
// render (e.g. an audio file that finishes decoding late) compare their
// captured token against the live value and no-op if the page has since
// moved on - this stops a slow-to-resolve callback from the PREVIOUS trial
// from reaching into the NEXT trial's DOM (same element IDs are reused
// across renders) and, say, prematurely enabling its Next button.
let renderToken = 0;

function render(){
  renderToken++;
  if(isAdmin){ renderAdmin(); return; }
  if(state.screen === "intro") return renderIntro();
  if(state.screen === "practice") return renderPractice();
  if(state.screen === "trial") return renderTrial();
  if(state.screen === "interstitial") return renderInterstitial();
  if(state.screen === "done") return renderDone();
}

  let playedA = false, playedB = false, playedOnce = !!selected;

  function updateNextEnabled(){
    if(myToken !== renderToken) return; // a newer screen is showing now - ignore
    const btn = document.getElementById("nextBtn");
    if(!btn) return;
    if(isCCR){
      btn.disabled = !(playedA && playedB && state.answers[trial.id]!=null);

  if(isCCR){

    const firstDemo = trial._firstIsRef ? trial.demoRef      : trial.demoTest;

    btnA.onclick = () => {

        btnA.disabled = false; btnA.classList.add("played"); playedA = true;
        playCountEl.textContent = "You can replay either clip as many times as you like";
        updateNextEnabled();
      });

      playStimulus(secondUrl, secondDemo, () => {

        updateNextEnabled();
      });
    };

    const playBtn = document.getElementById("playBtn");
    const scopeLine = document.getElementById("scopeLine").querySelector("path");
    const playCountEl = document.getElementById("playCount");
    let localPlays = 0;
    playBtn.onclick = () => {
      playBtn.disabled = true;
      animateScope(scopeLine, true);
      playStimulus(trial.audioUrl, trial.demo, () => {
        if(myToken !== renderToken) return;

      updateNextEnabled();
    };
  });

  document.getElementById("nextBtn").onclick = async () => {
    if(state.submitting) return; // ignore double-clicks / repeated fires while a save is in flight
    state.submitting = true;

    const nextBtn = document.getElementById("nextBtn");
    const originalLabel = nextBtn.textContent;
    nextBtn.disabled = true;
    nextBtn.textContent = "Saving...";

    const rawScore = state.answers[trial.id];

    if(trial.attention){
      const expected = isCCR ? 0 : 5;
      state.attentionFail = state.attentionFail || (rawScore !== expected);
    }

    let ok;
    if(isCCR){
      // rawScore = "second clip vs first clip". Normalize to "test vs reference".
      const adjustedScore = trial._firstIsRef ? rawScore : -rawScore;
      ok = await saveResponse({
        testId: TEST_ID,
        participantId: state.participantId,
        trialId: trial.id,
        type: "ccr",
        refCondition: trial.refCondition,
        testCondition: trial.testCondition,
        rawScore, adjustedScore,
        firstIsRef: trial._firstIsRef,
        isAttentionCheck: !!trial.attention,
        order: state.idx,
        ts: Date.now()
      });
    } else {
      ok = await saveResponse({
        testId: TEST_ID,
        participantId: state.participantId,
        trialId: trial.id,
        type: "acr",
        condition: trial.condition,
        score: rawScore,
        isAttentionCheck: !!trial.attention,
        order: state.idx,
        ts: Date.now()
      });
    }

    if(myToken !== renderToken) return; // page already moved on for some other reason

    if(!ok){
      // Do NOT advance - this is exactly what prevents a sample from being
      // silently skipped when a save fails (e.g. a flaky connection to the
      // Google Apps Script backend).
      state.submitting = false;
      nextBtn.disabled = false;
      nextBtn.textContent = originalLabel;
      alert("Your answer could not be saved (network issue?). Please try clicking Next again.");
      return;

    state.submitting = false;

    if(state.idx < total-1){
      state.idx++;
      render(); // stays in "trial" screen, same phase
    } else if(state.phase === "test1"){
      state.screen = "interstitial"; // leads into the Test 2 practice item
      render();
    } else {
      state.screen = "done";
      render();
    }
  };
}

function animateScope(pathEl, playing){
  if(playing){
    pathEl.setAttribute("d","M0,18 Q15,4 30,18 T60,18 T90,18 T120,18 T150,18 T180,18");
    pathEl.style.transition = "d .3s ease";
  } else {
    pathEl.setAttribute("d","M0,18 L180,18");
  }
}

       ${state.order.length} trials.

  `;

function exportCSV(all){
  const header = ["participantId","type","trialId","condition","refCondition","testCondition",
    "score","rawScore","adjustedScore","firstIsRef","isAttentionCheck","order","ts"];
  const lines = [header.join(",")];
  all.forEach(r=>{
    const row = header.map(h => r[h]===undefined ? "" : String(r[h]).replace(/,/g,";"));
    lines.push(row.join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${TEST_ID}_responses.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  all.forEach(r => (byPid[r.participantId] ||= []).push(r));
  const nParticipants = Object.keys(byPid).length;
  const failedAttn = Object.entries(byPid).filter(([pid,recs]) =>
    recs.some(r => r.isAttentionCheck && (r.type==='ccr' ? r.rawScore !== 0 : r.score !== 5))
  ).map(([pid])=>pid);

  function stats(arr){
    const n = arr.length;
    const mean = arr.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(n-1,1));
    const ci = 1.96*sd/Math.sqrt(n);
    return {n, mean, sd, ci};
  }

  // ACR aggregation
  const byCond = {};
  all.filter(r=>r.type==='acr' && !r.isAttentionCheck).forEach(r=>{
    (byCond[r.condition] ||= []).push(r.score);
  });
  const acrRows = Object.entries(byCond).map(([cond,arr])=>{
    const s = stats(arr);
    const pct = (s.mean/5*100).toFixed(0);
    return `<tr>
      <td>${cond}</td><td>${s.n}</td><td>${s.mean.toFixed(2)}</td>
      <td>±${s.ci.toFixed(2)}</td><td>${s.sd.toFixed(2)}</td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  }).join("");

  // CCR aggregation (by testCondition vs refCondition pair, using adjustedScore = CMOS)
  const byPair = {};
  all.filter(r=>r.type==='ccr' && !r.isAttentionCheck).forEach(r=>{
    const key = `${r.testCondition} vs ${r.refCondition}`;
    (byPair[key] ||= []).push(r.adjustedScore);
  });
  const ccrRows = Object.entries(byPair).map(([pair,arr])=>{
    const s = stats(arr);
    const pct = Math.min(Math.abs(s.mean)/3*50, 50);
    const isNeg = s.mean < 0;
    return `<tr>
      <td>${pair}</td><td>${s.n}</td><td>${s.mean>=0?'+':''}${s.mean.toFixed(2)}</td>
      <td>±${s.ci.toFixed(2)}</td><td>${s.sd.toFixed(2)}</td>
      <td><div class="bar-track"><div class="bar-fill ${isNeg?'neg':''}" style="width:${pct}%;margin-left:${isNeg?50-pct:50}%"></div></div></td>
    </tr>`;
  }).join("");

  body.innerHTML = `
    <div class="row" style="gap:20px;margin:6px 0 4px;">
      <span class="pill">Participants N = ${nParticipants}</span>
      <span class="pill ${failedAttn.length?'bad':''}">Failed attention check = ${failedAttn.length}</span>
      <span class="pill">Total responses = ${all.length}</span>
    </div>

    <h2 class="section">Test 1 · ACR (Mean Opinion Score)</h2>
    <table class="admin-table">
      <thead><tr><th>Condition</th><th>N</th><th>Mean MOS</th><th>95% CI</th><th>SD</th><th></th></tr></thead>
      <tbody>${acrRows || `<tr><td colspan="6">No ACR data yet.</td></tr>`}</tbody>
    </table>

    <h2 class="section">Test 2 · CCR (Comparison MOS, test vs reference)</h2>
    <table class="admin-table">
      <thead><tr><th>Comparison</th><th>N</th><th>Mean CMOS</th><th>95% CI</th><th>SD</th><th>-3 ← 0 → +3</th></tr></thead>
      <tbody>${ccrRows || `<tr><td colspan="6">No CCR data yet.</td></tr>`}</tbody>
    </table>

    ${failedAttn.length ? `<p style="margin-top:14px;">Participants who failed the attention check: ${failedAttn.join(", ")} (consider excluding or flagging for review before final analysis).</p>` : ""}
  `;
}

render();
</script>
</body>
</html>
